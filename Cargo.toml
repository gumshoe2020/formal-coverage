[package]
name = "formal-coverage"
version = "1.5.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
semver = "1"
sha2 = "0.10"
object = { version = "0.37", default-features = false, features = ["std", "read_core", "elf", "macho", "unaligned"] }
gimli = { version = "0.32", default-features = false, features = ["std", "read"] }
rustc-demangle = "0.1"

[workspace]
exclude = ["fixtures/inventory", "fixtures/classification", "fixtures/evidence"]
