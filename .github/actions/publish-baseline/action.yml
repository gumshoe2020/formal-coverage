name: Publish recorded coverage baseline
description: Record main's measurement on the data branch (floor "recorded" mode) using GITHUB_TOKEN
inputs:
  artifact-name:
    description: Artifact name given to the coverage action
    default: coverage-badges
runs:
  using: composite
  steps:
    - name: Require push to main
      shell: bash
      run: |
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_REF" = refs/heads/main
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact-name }}-record
        path: ${{ runner.temp }}/coverage-record-in
    - name: Record baselines/<sha>.json on the data branch only
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/../../../ci/record.py" "$RUNNER_TEMP/coverage-record-in"
